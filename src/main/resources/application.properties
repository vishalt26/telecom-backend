spring.application.name=telecom-backend

# Local secrets live in backend/.env (git-ignored). In production (Render) set real environment variables instead.
spring.config.import=optional:file:.env[.properties]

# Render injects PORT; locally it falls back to 8080
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.default-property-inclusion=non_null

# Never leak internals in error responses
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# App settings
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:30}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.rate-limit.auth-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:20}
# Behind Render's proxy, use the real client IP from X-Forwarded-For
server.forward-headers-strategy=native
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.seed-demo=${SEED_DEMO:false}
app.demo-password=${DEMO_PASSWORD:}
